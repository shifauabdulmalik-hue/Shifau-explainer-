<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SHIFAU EXPLAINER</title>

<link rel="stylesheet" href="style.css">
</head>

<body>

<div class="container">

    <img src="logo.png" class="logo" alt="SHIFAU EXPLAINER">

    <h1>SHIFAU EXPLAINER</h1>

    <p class="subtitle">
        Upload Videos • Images • PDFs • Documents
    </p>

    <div class="password-box">

        <input
            type="password"
            id="password"
            placeholder="Enter Upload Password">

        <button id="unlockBtn">
            Unlock
        </button>

    </div>

    <div id="uploadArea" class="locked">

        <label class="dropZone">

            <input
                type="file"
                id="fileInput"
                multiple>

            <div class="bigIcon">
                📁
            </div>

            <h3>Click to choose files</h3>

            <p>
                Videos, PDFs, Images and more
            </p>

        </label>

        <button id="uploadBtn">
            Upload Files
        </button>

        <div id="progress"></div>

        <div id="status"></div>

    </div>

</div>

<script src="app.js"></script>

</body>
</html>
